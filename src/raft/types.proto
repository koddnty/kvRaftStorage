syntax = "proto3";

package craft;

message LogEntry {
    uint64 term = 1;
    bytes command = 2;
}

message LogSegmentMeta {
    uint64 start_index = 1;
    uint64 end_index = 2;
    uint64 file_size = 3;
}

message LogSegment {
    LogSegmentMeta = 1;
    repeated LogEntry = 2;
}

message PersistentState {
    uint64 current_term = 1;    // 当前任期
    int64 voted_for = 2;      // 投票对象
    uint64 commitIdx = 3;     // 提交idx
    uint64 appliedIdx = 4;    // 应用idx
}

// 选举投票
message RequestVoteArgs {
    uint64 term = 1;
    int32 candidate_id = 2;
    uint64 last_log_index = 3;
    uint64 last_log_term = 4;
}

message RequestVoteReply {
    uint64 term = 1;
    bool vote_granted = 2;
}


// 发送心跳 复制日志
message AppendEntriesArgs {
    uint64 term = 1;
    int32 leader_id = 2;
    uint64 prev_log_index = 3;
    uint64 prev_log_term = 4;
    repeated LogEntry entries = 5;
    uint64 leader_commit = 6;
}

message AppendEntriesReply {
    uint64 term = 1;
    bool success = 2;
}